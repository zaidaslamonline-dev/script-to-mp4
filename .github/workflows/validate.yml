name: Validate project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON configuration
        run: |
          python -m json.tool config/defaults.json > /dev/null
          python -m json.tool campaigns/example-campaign/campaign.json > /dev/null
          python -m json.tool clients/example-client/brand.json > /dev/null
      - name: Compile pipeline scripts
        run: python -m compileall -q scripts
      - name: Install caption romanization dependency
        run: python -m pip install uroman
      - name: Run approval-gate tests
        run: python -m unittest discover -s tests -v
