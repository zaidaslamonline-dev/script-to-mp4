name: FixReach single-video production render

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/fixreach-transparent-characters.zip'
      - 'assets/characters/**'

permissions:
  contents: read

concurrency:
  group: fixreach-production-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg and renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Install the supplied transparent character pack
        run: |
          if [ -f content/fixreach-transparent-characters.zip ]; then
            mkdir -p assets/characters
            unzip -oq content/fixreach-transparent-characters.zip -d assets/characters
          fi
      - name: Verify FixReach source assets
        run: |
          test -f content/voiceover.wav || test -n "$(find content -maxdepth 1 -type f -iname '*.mp3' -print -quit)"
          python - <<'PY'
          from pathlib import Path
          import sys
          required = [
              "LALA-13_Frustrated-Hand-on-Forehead.png",
              "LALA-08_Holding-Smartphone-Left-Hand-Gesture.png",
              "LALA-09_Asking-Question-Both-Palms-Up.png",
              "LALA-11_Making-Point-Index-Finger-Raised.png",
              "LALA-17_Thumbs-Up-Approval.png",
              "LALA-24_Counting-and-Holding-Cash.png",
              "SID-20_Surprised-Open-Mouth.png",
              "SID-17_Emphasising-Point-Speaking.png",
              "SID-05_Explaining-Palm-Up-Mouth-Open.png",
              "SID-24_Celebrating-Both-Fists-Raised.png",
              "SID-07_Pointing-Right-Mouth-Open.png",
          ]
          root = Path("assets/characters")
          missing = [name for name in required if not (root/name).is_file()]
          if missing:
              print("Character assets need to be copied from the supplied fixreach-transparent-characters.zip into assets/characters/:")
              print("\n".join(missing))
              sys.exit(2)
          PY
      - name: Install HyperFrames and animation runtime
        run: |
          npm install --global hyperframes
          npx hyperframes doctor
      - name: Fetch sound effects and background music from GitHub repositories
        run: |
          mkdir -p /tmp/fixreach-audio assets/audio/sfx assets/audio/bgm
          git clone --depth 1 https://github.com/GeorgeQLe/assets-sfx-ui.git /tmp/fixreach-audio/ui
          git clone --depth 1 https://github.com/blancmathis/Super_Bash_Folds.git /tmp/fixreach-audio/music
          find /tmp/fixreach-audio/ui/assets -type f -iname '*.ogg' | sort > /tmp/sfx-list.txt
          test -s /tmp/sfx-list.txt
          cp "$(grep -m1 '/open_' /tmp/sfx-list.txt || grep -m1 '/click_' /tmp/sfx-list.txt)" assets/audio/sfx/transition.ogg
          cp "$(grep -m1 '/confirmation_' /tmp/sfx-list.txt)" assets/audio/sfx/confirmation.ogg
          cp "$(grep -m1 '/question_' /tmp/sfx-list.txt)" assets/audio/sfx/notification.ogg
          cp "$(grep -m1 '/maximize_' /tmp/sfx-list.txt || grep -m1 '/click_' /tmp/sfx-list.txt)" assets/audio/sfx/pop.ogg
          find /tmp/fixreach-audio/music -type f \( -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.wav' \) | grep -Ei 'music|audio|loop|theme|bgm' | head -20 > /tmp/music-list.txt
          if [ ! -s /tmp/music-list.txt ]; then
            echo "No music track found in configured upstream repository"; exit 1
          fi
          MUSIC="$(head -n1 /tmp/music-list.txt)"
          ffmpeg -v error -y -i "$MUSIC" -c:a libvorbis -q:a 5 assets/audio/bgm/background.ogg
          cp /tmp/fixreach-audio/ui/LICENSES/* assets/audio/ 2>/dev/null || true
          printf 'SFX source: GeorgeQLe/assets-sfx-ui\\nBGM source: blancmathis/Super_Bash_Folds\\n' > assets/audio/SOURCES.txt
      - name: Normalize the approved Viraj voiceover
        run: |
          mkdir -p production/voiceover production/subtitles renders/fixreach
          if [ ! -f content/voiceover.wav ]; then
            mapfile -t files < <(find content -maxdepth 1 -type f -iname '*.mp3' | sort)
            if [ "${#files[@]}" -ne 1 ]; then echo "Expected exactly one MP3 in content/"; exit 1; fi
            ffmpeg -v error -y -i "${files[0]}" -ar 48000 -ac 1 -c:a pcm_s16le content/voiceover.wav
          fi
          ffmpeg -v error -y -i content/voiceover.wav -ar 48000 -ac 1 -c:a pcm_s16le production/voiceover/voiceover.wav
      - name: Generate Hindi-English timed captions
        run: |
          python -m pip install openai-whisper
          whisper production/voiceover/voiceover.wav --model small --task transcribe --output_format srt --output_dir production/subtitles --fp16 False
      - name: Render the six-scene FixReach video with HyperFrames
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 production/voiceover/voiceover.wav)
          mkdir -p hyperframes/fixreach
          cp hyperframes/fixreach/index.html hyperframes/fixreach/index.html
          sed -i "s/92.84/$DURATION/g" hyperframes/fixreach/index.html
          npx hyperframes lint hyperframes/fixreach
          npx hyperframes check hyperframes/fixreach
          npx hyperframes render hyperframes/fixreach --output renders/fixreach/FixReach.mp4 --fps 30
          ffmpeg -v error -y -i renders/fixreach/FixReach.mp4 -i production/voiceover/voiceover.wav -filter_complex "[0:a]volume=0.16[music];[1:a]volume=1.0[voice];[music][voice]amix=inputs=2:duration=longest:dropout_transition=2,loudnorm=I=-16:TP=-1.5:LRA=11[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest renders/fixreach/FixReach-mix.mp4
          mv renders/fixreach/FixReach-mix.mp4 renders/fixreach/FixReach.mp4
      - name: Validate the exported MP4
        run: |
          python scripts/qa_ffprobe.py renders/fixreach/FixReach.mp4 --width 1080 --height 1920 --fps 30
          ffmpeg -v error -i renders/fixreach/FixReach.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: fixreach-final-render-candidate
          path: renders/fixreach/FixReach.mp4
          if-no-files-found: error
          retention-days: 14
