name: FixReach voice audition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only Kokoro
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tts.txt numpy
      - name: Generate two distinct character auditions
        run: python scripts/generate_voice_preview.py --output-dir voice-preview
      - uses: actions/upload-artifact@v4
        with:
          name: fixreach-kokoro-voice-audition
          path: voice-preview/
          if-no-files-found: error
          retention-days: 14
