name: FixReach voice audition

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  audition:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 1 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'zaidaslamonline-dev' &&
        github.event.comment.body == '/run-fixreach-voice-audition'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only Kokoro
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tts.txt numpy
      - name: Generate 16 character voice auditions
        run: python scripts/generate_voice_preview.py --output-dir voice-preview
      - uses: actions/upload-artifact@v4
        with:
          name: fixreach-16-voice-options
          path: voice-preview/
          if-no-files-found: error
          retention-days: 14
