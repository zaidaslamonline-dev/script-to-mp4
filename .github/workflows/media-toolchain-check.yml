name: Media toolchain check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install FFmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version
      - name: Install Node dependencies
        run: npm install
      - name: Install Python media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audio.txt
      - name: Verify binaries and Python imports
        run: |
          node --version
          npx hyperframes doctor
          yt-dlp --version
          python -c "import whisper, kokoro; print('Whisper and Kokoro imports OK')"
