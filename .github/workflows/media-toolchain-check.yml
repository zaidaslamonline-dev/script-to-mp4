name: Media toolchain check

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  check:
    # ChatGPT can trigger this by commenting on control issue #1.
    # Restrict the command to the repository owner and an exact command match.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 1 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'zaidaslamonline-dev' &&
        github.event.comment.body == '/run-media-check'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-audio.txt
      - name: Install FFmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version
      - name: Install Node dependencies
        run: npm install
      - name: Install Python media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audio.txt
      - name: Verify binaries and Python imports
        run: |
          node --version
          npx hyperframes doctor
          cd hyperframes && npx hyperframes lint
          cd ..
          yt-dlp --version
          python -c "import whisper, kokoro; print('Whisper and Kokoro imports OK')"
