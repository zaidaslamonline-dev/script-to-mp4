name: FixReach Indic Parler audition

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  audition:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 1 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'zaidaslamonline-dev' &&
        github.event.comment.body == '/run-indic-parler-audition'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch, torchaudio and Parler-TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libsndfile1
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install parler-tts transformers accelerate soundfile numpy
          python -m pip install --force-reinstall --no-deps torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, torchaudio; print('torch', torch.__version__, 'torchaudio', torchaudio.__version__); print('cuda', torch.cuda.is_available())"
      - name: Generate Sid and Lala Bhai auditions
        run: python scripts/audition_indic_parler.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixreach-indic-parler-audition
          path: voice-preview/
          if-no-files-found: ignore
          retention-days: 14
